[project]
name = "mlx-ui"
version = "0.8"
description = "A simple UI / Web / Frontend for MLX mlx-lm using Streamlit"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "mlx-lm>=0.25.2",
    "tiktoken>=0.9.0",
    "sentencepiece>=0.2.0",
    "streamlit>=1.45.1",
    "watchdog>=6.0.0",
]

[project.scripts]
mlx-ui = "streamlit:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = []
